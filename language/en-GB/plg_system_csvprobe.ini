PLG_SYSTEM_CSVPROBE="System - Ceebl RSForm CSV Export"
PLG_SYSTEM_CSVPROBE_DESCRIPTION="Excel UTF-8 CSV compatibility and configurable access control for RSForm! Pro directory exports."

PLG_SYSTEM_CSVPROBE_SETTINGS_LABEL="Plugin Settings"

PLG_SYSTEM_CSVPROBE_ENABLE_ENCODING_FIX_LABEL="Enable Excel UTF-8 Fix"
PLG_SYSTEM_CSVPROBE_ENABLE_ENCODING_FIX_DESC="Improves Excel compatibility for UTF-8 CSV exports so Persian and other non-Latin characters display correctly."

PLG_SYSTEM_CSVPROBE_RESTRICT_DOWNLOADS_LABEL="Restrict CSV Downloads"
PLG_SYSTEM_CSVPROBE_RESTRICT_DOWNLOADS_DESC="Allows CSV downloads only for users belonging to the selected Joomla user groups. Unauthorized download requests are blocked."

PLG_SYSTEM_CSVPROBE_ALLOWED_GROUPS_LABEL="Allowed User Groups"
PLG_SYSTEM_CSVPROBE_ALLOWED_GROUPS_DESC="Select the Joomla user groups permitted to download CSV files when restrictions are enabled. If no groups are selected, downloads are denied."

PLG_SYSTEM_CSVPROBE_HIDE_EXPORT_BUTTONS_LABEL="Hide Export Buttons"
PLG_SYSTEM_CSVPROBE_HIDE_EXPORT_BUTTONS_DESC="Hides CSV export buttons from unauthorized users when download restrictions are enabled. Server-side access control remains necessary."